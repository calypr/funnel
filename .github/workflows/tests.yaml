name: Go Tests

on:
  push:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

# Cancel redundant jobs (if a new job is triggered for the same workflow and ref)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go 1.x
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          # https://github.com/golangci/golangci-lint/releases/tag/v2.11.4
          version: v2.11.4

  unitTest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go 1.x
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@v1.13.0

    - name: Unit Tests
      id: unit_tests
      continue-on-error: true
      run: |
        gotestsum --junitfile=test-report.xml -- ./... -coverprofile=coverage.out
        go tool cover -func=coverage.out

    - name: Test Report
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        name: Unit Test Results
        path: test-report.xml
        reporter: java-junit

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unit-test-results
        path: |
          test-report.xml
          coverage.out
        if-no-files-found: warn

    - name: Fail job if tests failed
      if: steps.unit_tests.outcome == 'failure'
      run: exit 1
