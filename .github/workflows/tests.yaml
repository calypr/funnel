name: Go unit and integration tests

on:
  push:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

# Cancel redundant jobs (if a new job is triggered for the same workflow and ref)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduler-tests:
    name: Scheduler tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: boltdb
            label: BoltDB
          - backend: postgres
            label: PostgreSQL
    env:
      CGO_ENABLED: "1"
      FUNNEL_SCHEDULER_TEST_BACKEND: ${{ matrix.backend }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Download Go modules
      run: sh .github/scripts/download-go-modules.sh
    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@v1.13.0
    - name: Run scheduler contract against ${{ matrix.label }}
      run: gotestsum --format standard-verbose --junitfile=scheduler-tests.xml -- -race ./tests/schedulercontract -run '^TestSchedulerContract$' -count=1 -timeout=5m
    - name: Upload scheduler test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scheduler-test-results-${{ matrix.backend }}
        path: scheduler-tests.xml
        if-no-files-found: warn

  unitTest:
    name: Go tests (race detector and coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@v1.13.0

    - name: Download Go modules
      run: sh .github/scripts/download-go-modules.sh

    - name: Unit Tests
      id: unit_tests
      continue-on-error: true
      env:
        CGO_ENABLED: "1"
      run: |
        gotestsum --junitfile=test-report.xml -- -race ./... -skip '^TestSchedulerContract$' -coverprofile=coverage.out
        go tool cover -func=coverage.out

    - name: Test Report
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        name: Unit Test Results
        path: test-report.xml
        reporter: java-junit

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unit-test-results
        path: |
          test-report.xml
          coverage.out
        if-no-files-found: warn

    - name: Fail job if tests failed
      if: steps.unit_tests.outcome == 'failure'
      run: exit 1

  # Preserve the required status context until the stack's ruleset migration.
  required-go-tests:
    name: unitTest
    needs: [unitTest, scheduler-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report test result for existing required-check rules
        env:
          CHECK_RESULT: ${{ needs.unitTest.result }}
          SCHEDULER_RESULT: ${{ needs.scheduler-tests.result }}
        run: test "$CHECK_RESULT" = success && test "$SCHEDULER_RESULT" = success
