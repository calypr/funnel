# Workflow for running the TES compliance suite against Funnel
#
# This includes the following steps:
#  1. Build Funnel and store the resulting binary artifact
#  2. Install tes-compliance-suite and run against every version of TES simultaneously
#  3. start-report-deployment: Send a dispatch to the funnel-compliance repository to generate and publish
#     the tes-compliance-suite report to https://ohsu-comp-bio.github.io/funnel-compliance/
#
# Optionally debug via SSH
# Ref: https://fleetdm.com/engineering/tips-for-github-actions-usability
#
# To use this step uncomment and place anywhere in the build steps. The build will pause on this step and
# output a ssh address associated with the Github action worker. Helpful for debugging build steps and
# and intermediary files/artifacts.
#
# - name: Setup tmate session
#   uses: mxschmitt/action-tmate@v3

name: TES API compliance tests

permissions:
  contents: read

on:
  push:

# Cancel redundant jobs (if a new job is triggered for the same workflow and ref)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build compliance-test binary
    uses: ./.github/workflows/build.yaml

  compliance:
    name: TES ${{ matrix.version }} compliance (${{ matrix.db }}, ${{ matrix.compute }}, ${{ matrix.storage }})
    strategy:
      fail-fast: false
      matrix:
        version:
          - 1.0.0
          - 1.1.0
        # TODO: Re-enable postgres and s3 tests once we have these backends working in CI
        db:
          - local
          # - postgres
        # Temporary: Only test local compute backend until we bring up a K8s cluster in Github Actions
        # compute: ["local", "kubernetes"]
        compute:
          - local
        storage:
          - local
          # - s3
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPLIANCE_RUNNER_REF: bc3eb911e877521409348e0225852d072d4de196
    steps:
      # Required to access the tests config files (e.g. tests/testdata/config/postgres.config.yml)
      # Perhaps uploading it as an artifact would be more efficient?
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          skip-decompress: false
          digest-mismatch: warn
          name: funnel

      - name: Start Funnel server
        run: |
          touch config.yml

          if [ ${{ matrix.db }} = "postgres" ]; then
            make start-postgres
            for i in $(seq 1 30); do
              docker exec funnel-postgres-test pg_isready -U postgres && break
              echo "Waiting for Postgres... ($i/30)"
              sleep 1
              [ $i -eq 30 ] && { echo "Postgres did not become ready in time"; exit 1; }
            done
            cat `pwd`/tests/testdata/config/postgres.config.yml >> config.yml
          fi

          if [ ${{ matrix.storage }} = "s3" ]; then
            docker run -d -p 9000:9000 --name minio \
                       -e "MINIO_ROOT_USER=example-key" \
                       -e "MINIO_ROOT_PASSWORD=example-secret" \
                       --tmpfs /data:rw,mode=1777 \
                       quay.io/cdis/minio:chainguard-latest-2026-09-25@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1 server /data
            cat `pwd`/tests/testdata/config/minio-s3.config.yml >> config.yml
          fi

          if [ ${{ matrix.compute }} = "kubernetes" ]; then
            kubectl apply -f tests/k8s
            cat `pwd`/tests/k8s.config.yml >> config.yml
          fi

          chmod +x funnel
          ./funnel server run --config `pwd`/config.yml &> funnel.logs &
          echo $! > funnel.pid

      - name: Wait for Funnel to be ready
        run: |
          for i in $(seq 1 10); do
            if ! kill -0 $(cat funnel.pid) 2>/dev/null; then
              echo "Funnel process exited unexpectedly:"
              cat funnel.logs
              exit 1
            fi
            curl -sf http://localhost:8000/v1/service-info && exit 0
            echo "Waiting for Funnel... ($i/10)"
            sleep 1
          done
          echo "Funnel did not become ready in time:"
          cat funnel.logs
          exit 1

      - name: Run OpenAPI Test Runner
        run: |
          git init openapi-test-runner
          git -C openapi-test-runner remote add origin https://github.com/elixir-cloud-aai/openapi-test-runner
          git -C openapi-test-runner fetch --depth 1 origin "$COMPLIANCE_RUNNER_REF"
          git -C openapi-test-runner checkout --detach FETCH_HEAD
          cd openapi-test-runner
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          python setup.py install
          openapi-test-runner report --version "${{ matrix.version }}" --server "http://localhost:8000/" 2>&1 | tee compliance.log
          grep -q "Failed - 0" compliance.log || { echo "Compliance tests failed"; exit 1; }

      - name: Collect diagnostics and stop Funnel
        if: always()
        run: |
          if [ -f funnel.pid ]; then
            kill -TERM "$(cat funnel.pid)" 2>/dev/null || true
          fi

      - name: Upload compliance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-${{ matrix.version }}
          path: |
            funnel.logs
            openapi-test-runner/compliance.log
          if-no-files-found: warn
