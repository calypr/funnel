name: Kubernetes PVC and S3 end-to-end tests

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-e2e:
    name: Kubernetes storage and failure recovery (k3d)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install k3d
        run: |
          install_dir="$RUNNER_TEMP/k3d-v5.8.3"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 \
            --output "$install_dir/k3d"
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  $install_dir/k3d" | sha256sum --check
          chmod +x "$install_dir/k3d"
          "$install_dir/k3d" version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Test storage and task failure recovery in k3d
        env:
          FUNNEL_E2E_OUTPUT_DIR: ${{ runner.temp }}/funnel-storage-e2e
        run: tests/kubernetes-storage/run.sh
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: kubernetes-storage-e2e
          path: |
            ${{ runner.temp }}/funnel-storage-e2e/*.log
            ${{ runner.temp }}/funnel-storage-e2e/*.json
            ${{ runner.temp }}/funnel-storage-e2e/*.txt
            ${{ runner.temp }}/funnel-storage-e2e/pvs.yaml
          if-no-files-found: warn
