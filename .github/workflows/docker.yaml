# This workflow builds and pushes a multi-arch image to Quay.io
# Adapted from actions-arm64-native_example by @gartnera
# ref: https://github.com/gartnera/actions-arm64-native_example/blob/main/.github/workflows/build.yml

name: Build and publish container images

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUAY_REPO: quay.io/ohsu-comp-bio/funnel

jobs:
  build:
    name: Build and push image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner || 'ubuntu-22.04' }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.QUAY_REPO }}

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.QUAY_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=funnel-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=funnel-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"          

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform image manifest
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          skip-decompress: false
          digest-mismatch: warn
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare build tag
        id: build_tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Use the publication time, rather than the commit time, so this
          # identifies when this image was actually pushed to Quay.
          published_at="$(date -u +'%Y-%m-%d-%H-%M-%SZ')"
          short_sha="${COMMIT_SHA:0:8}"

          if [[ "$REF_TYPE" == "branch" ]]; then
            ref_tag="${REF_NAME//\//_}"
            echo "branch_value=${ref_tag}" >> "$GITHUB_OUTPUT"
          else
            ref_tag="$REF_NAME"
          fi

          # Keep the value valid as a Docker tag while retaining the source
          # ref, readable UTC timestamp, and commit identity.
          ref_tag="$(printf '%s' "$ref_tag" | tr -cs '[:alnum:]._-' '-')"
          ref_tag="${ref_tag#-}"
          ref_tag="${ref_tag%-}"
          echo "value=${ref_tag}-${published_at}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.QUAY_REPO }}
          flavor: |
            latest=false
          tags: |
            # Semver
            type=semver,pattern={{version}},value=${{ github.ref_name }}

            # Latest
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}

            # Branch pushes (/ replaced with _ to preserve branch prefix context)
            type=raw,value=${{ steps.build_tag.outputs.branch_value }},enable=${{ github.ref_type == 'branch' }},latest=false

            # Immutable, human-readable publication tag
            type=raw,value=${{ steps.build_tag.outputs.value }},latest=false

            # PR pushes
            type=ref,event=pr,latest=false

            # Git Tag
            type=ref,event=tag,latest=false

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.QUAY_REPO }}@sha256:%s ' *)          

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.QUAY_REPO }}:${{ steps.meta.outputs.version }}
