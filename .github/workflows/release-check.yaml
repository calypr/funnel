name: Release packaging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and smoke-test release archives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test release tag validation
        run: .github/scripts/test-release-tag.sh
      - name: Build snapshots without publishing
        run: make snapshot release-notes
      - name: Verify checksums, archive contents, and native binary
        run: .github/scripts/check-release-archives.sh
      - name: Install the native archive into a temporary directory
        run: .github/scripts/test-release-install.sh
