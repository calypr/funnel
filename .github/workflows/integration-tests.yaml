name: Integration Tests (K8s)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

# Cancel redundant jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    env:
      NXF_VER: '25.10.4'
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -----------------
      # 1. Cluster Setup
      # -----------------
 
      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.31.0
          kubectl_version: v1.35.0
          cluster_name: funnel-gen3

      - name: Build and load candidate Funnel image
        run: bash tests/kubernetes/build-and-load-candidate-image.sh

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Install local Funnel image post-renderer
        run: helm plugin install "$GITHUB_WORKSPACE/tests/gen3"
 
      # ---------------------------
      # 2. Install Funnel + MinIO
      # ---------------------------
 
      - name: Install Funnel
        run: |
          cat <<EOF > values.yaml
          endpoint_url: http://minio.default.svc.cluster.local:9000
          authenticationSource: driver

          AmazonS3:
            Disabled: true

          GenericS3:
          - Disabled: false
            Endpoint: http://minio.default:9000
            Key: example
            Secret: example-password
            Region: us-east-1
            Bucket: local

          Database: postgres

          EventWriters:
            - log
            - postgres

          mongodb:
            enabled: false  
          EOF

          helm repo add calypr https://calypr.org/helm-charts
          helm repo update
          helm upgrade --install funnel calypr/funnel --wait --timeout=60s --version 0.1.99-rc.35 --values values.yaml --post-renderer funnel-ci-image

      - name: Debug Funnel pods (on failure)
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl get events --sort-by='.lastTimestamp'

      - name: Install Minio
        run: |
          helm upgrade --install minio oci://registry-1.docker.io/bitnamicharts/minio \
            --version 17.0.21 \
            --values tests/kubernetes/minio-values.yaml \
            --wait --timeout=5m

      - name: Install AWS S3 CSI Driver (for testing S3 mounts in Funnel)
        run: |
          kubectl create secret generic aws-secret \
            --namespace kube-system \
            --from-literal "key_id=example" \
            --from-literal "access_key=example-password"

          helm repo add aws-mountpoint-s3-csi-driver https://awslabs.github.io/mountpoint-s3-csi-driver
          helm repo update
          helm upgrade --install aws-mountpoint-s3-csi-driver aws-mountpoint-s3-csi-driver/aws-mountpoint-s3-csi-driver \
            --namespace kube-system \
            --version 2.8.0 \
            --values tests/gen3/csi-images.yaml \
            --wait --timeout=3m \
            --set awsAccessSecret.key_id=example,awsAccessSecret.access_key=example-password

      # -------------------------------------
      # 3. Expose services for local testing
      # -------------------------------------
 
      - name: Port-forward Funnel
        run: kubectl port-forward svc/funnel 8000:8000 &

      - name: Wait for Funnel port-forward
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/service-info && break
            echo "Waiting for Funnel... ($i/10)"
            sleep 2
          done

      - name: Port-forward Minio
        run: kubectl port-forward svc/minio 9000:9000 &

      - name: Wait for Minio port-forward
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:9000/minio/health/ready && break
            echo "Waiting for Minio... ($i/10)"
            sleep 2
          done
 
      # ----------------------------
      # 4. Run Nextflow + nf-canary
      # ----------------------------
        
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          chmod +x nextflow
          mkdir -p $HOME/.local/bin
          mv nextflow $HOME/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      # Ref: https://github.com/nextflow-io/nf-ga4gh/blob/main/.github/workflows/build.yml
      - name: Install + configure nf-canary
        env:
          PLUGIN_VERSION: '1.5.0'
        run: |
          git clone https://github.com/seqeralabs/nf-canary

          cd nf-canary
          git checkout b1a08f05114076ee6f0143cb2e2a1bd92ac160ac

          cat <<EOF > funnel.config
          // Nextflow config file for running on TES Backend
          plugins {
            id 'nf-ga4gh@${PLUGIN_VERSION}'
          }
          process {
              executor = 'tes'
              // Pinning to recent LTS release for stability/security
              container = 'ubuntu:24.04'
          }
          params {
              container = 'ubuntu:24.04'
              fusion = false
              gpu = false
          }
          aws {
              accessKey = "example"
              secretKey = "example-password"
              region = 'us-east-1'
              client {
                  endpoint = "http://localhost:9000"
                  s3PathStyleAccess = true
                  maxErrorRetry = 0
              }
          }
          EOF

      - name: Run nf-canary tests
        id: nf_canary
        env:
          NXF_TES_ENDPOINT: http://localhost:8000
          NXF_ANSI_LOG: false
        run: |
          set -o pipefail
          cd nf-canary
          nextflow -c funnel.config run main.nf -with-report report.html -w s3://local/work 2>&1 | tee nextflow.log
      
      # ------------------------------
      # 5. Upload test logs + reports
      # ------------------------------

      - name: Diagnose Kubernetes failures
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods -A
          kubectl get events -A --sort-by='.lastTimestamp'
          kubectl logs -l app.kubernetes.io/instance=minio --all-containers --tail=100 || true
          for pod in $(kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}'); do
            namespace=${pod%%/*}
            name=${pod#*/}
            kubectl -n "$namespace" logs "$name" --all-containers --prefix --tail=200 || true
            kubectl -n "$namespace" logs "$name" --all-containers --prefix --previous --tail=200 || true
          done

      - name: Upload Nextflow logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: nextflow-logs
          path: |
            nf-canary/nextflow.log
            nf-canary/report.html
            nf-canary/.nextflow.log
          if-no-files-found: ignore
          include-hidden-files: true
