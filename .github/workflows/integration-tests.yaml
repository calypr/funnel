name: Integration Tests (K8s)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

# Cancel redundant jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  integration-tests:
    runs-on: ubuntu-latest
 
    steps:
      # -----------------
      # 1. Cluster Setup
      # -----------------
 
      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: funnel-gen3

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
 
      # ---------------------------
      # 2. Install Funnel via Helm
      # ---------------------------
 
      - name: Install Funnel
        run: |
          helm repo add calypr https://calypr.org/helm-charts
          helm repo update
          helm upgrade --install funnel calypr/funnel --wait --timeout=60s --version 0.1.99-rc.35

      - name: Debug Funnel pods (on failure)
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl get events --sort-by='.lastTimestamp'

      # -------------------------------------
      # 3. Expose services for local testing
      # -------------------------------------
 
      - name: Port-forward Funnel
        run: kubectl port-forward svc/funnel 8000:8000 &

      - name: Wait for Funnel port-forward
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/service-info && break
            echo "Waiting for Funnel... ($i/10)"
            sleep 2
          done
 
      # ----------------------------
      # 4. Run Nextflow + nf-canary
      # ----------------------------
        
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          chmod +x nextflow
          mkdir -p $HOME/.local/bin
          mv nextflow $HOME/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      # Ref: https://github.com/nextflow-io/nf-ga4gh/blob/main/.github/workflows/build.yml
      - name: Clone nf-canary
        run: git clone https://github.com/seqeralabs/nf-canary
 
      - name: Configure nf-canary for TES (Funnel)
        run: |
          cat <<EOF > nextflow.config
          // Nextflow config file for running on TES Backend
          plugins {
            id 'nf-ga4gh@${PLUGIN_VERSION}'
          }
          process {
              executor = 'tes'
              // Pinning to recent LTS release for stability/security
              container = 'ubuntu:24.04'
          }
          params {
              // TES
              endpoint                   = 'http://localhost:8000'
              basicUsername              = null
              basicPassword              = null
          }
          report.enabled = true
          timeline.enabled = true
          EOF

      - name: Run nf-canary tests
        id: nf_canary
        env:
          NXF_TES_ENDPOINT: http://localhost:8000
          NXF_ANSI_LOG: false
        run: |
          cd nf-canary
          nextflow run main.nf -with-report report.html 2>&1 | tee nextflow.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      
      # -------------------
      # 5. Verify K8s Jobs
      # -------------------
 
      - name: Verify Kubernetes jobs completed
        run: |
          echo "=== All jobs in default namespace ==="
          kubectl get jobs -o wide
 
          FAILED=$(kubectl get jobs \
            --field-selector=status.failed!=0 \
            -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
 
          if [ -n "$FAILED" ]; then
            echo "Failed jobs: $FAILED"
            for JOB in $FAILED; do
              echo "--- Logs for $JOB ---"
              kubectl logs job/$JOB --tail=50 || true
            done
            exit 1
          fi
 
          SUCCEEDED=$(kubectl get jobs \
            --field-selector=status.successful!=0 \
            -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
 
          if [ -z "$SUCCEEDED" ]; then
            echo "No jobs completed successfully — did any tasks run?"
            kubectl describe jobs || true
            exit 1
          fi
 
          echo "All Kubernetes jobs completed successfully: $SUCCEEDED"
 
      # ------------------------------
      # 6. Upload test logs + reports 
      # ------------------------------
 
      - name: Upload Nextflow logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextflow-logs
          path: |
            nf-canary/nextflow.log
            nf-canary/report.html
            nf-canary/.nextflow.log
          if-no-files-found: ignore

