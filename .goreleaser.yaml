version: 2

builds:
  - binary: funnel
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags: >
      -X github.com/calypr/funnel/version.BuildDate={{.Date}}
      -X github.com/calypr/funnel/version.GitCommit={{.ShortCommit}}
      -X github.com/calypr/funnel/version.GitBranch={{.Env.BRANCH}}
      -X github.com/calypr/funnel/version.GitUpstream={{.GitURL}}
      -X github.com/calypr/funnel/version.Version={{.Version}}

dist: build/release

release:
  draft: false
  prerelease: auto
  header: |
    Read the [upgrade guide](https://github.com/calypr/funnel/blob/{{ .Tag }}/docs/upgrading.md) before upgrading.
    This release changes Go import paths, plugin transport, and deployment configuration.
    Rebuild net/rpc plugins and the host together.

checksum:
  name_template: "funnel-{{.Tag}}-checksums.txt"

archives:
  - formats:
      - tar.gz
    name_template: "{{.ProjectName}}-{{.Os}}-{{.Arch}}-{{.Tag}}"
    files:
      - License.txt
      - README*
      - CHANGELOG*
      - docs/upgrading.md

# Add changelog generation
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
