# https://golangci-lint.run/docs/configuration/file/

version: "2"

linters:
  default: none
  enable:
    - govet
    - misspell
    - errcheck
  exclusions:
    paths:
      - vendor
      - webdash
      - cmd/webdash
      - funnel-work-dir
    presets:
      # Ignored-by-design error returns: fmt.Print* to usage writers,
      # deferred Close on best-effort cleanup, os.RemoveAll on temp dirs.
      - std-error-handling
    rules:
      - path: ".*bundle\\.go"
        linters: [govet, misspell]
      - path: ".*\\.pb\\.go"
        linters: [govet, misspell]
      - path: ".*\\.pb\\.gw\\.go"
        linters: [govet, misspell]
      - path: "_test\\.go"
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - vendor
      - webdash
      - cmd/webdash
      - funnel-work-dir
      - ".*bundle\\.go"
      - ".*\\.pb\\.go"
      - ".*\\.pb\\.gw\\.go"

run:
  timeout: 10m
